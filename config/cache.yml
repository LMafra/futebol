default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
  # The Supabase free tier holds 500 MB for every database of the project (primary, cache, queue, cable).
  store_options:
    max_size: <%= 64.megabytes %>
    namespace: production
