AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    - 'engines/*/spec/dummy/**/*'

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'engines/*/spec/**/*'
    - 'config/routes.rb'
    - 'app/admin/**/*'

Naming/PredicateMethod:
  AllowedMethods:
    - call
    - save

Metrics/MethodLength:
  Exclude:
    - 'db/migrate/**/*'
    - 'engines/*/db/migrate/**/*'

Metrics/AbcSize:
  Exclude:
    - 'db/migrate/**/*'
    - 'engines/*/db/migrate/**/*'
