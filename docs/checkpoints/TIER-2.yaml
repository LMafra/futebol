tickets:
  - id: TICKET-0003
    status: ok
    branch: ticket/0003-aasm-guard-order
    commit: 29ca0d0
    failures: 0
    evidence:
      - "Core::Match include AASM (column :status, whiny_persistence): start_match! (scheduled→live, guard kickoff), finish_match! (live→finished, guard placar), mark_scored! (finished|reverted→scored, guard scores_calculated_at nil, after grava timestamp + scoring_token), revert_match! (scored|finished→reverted, guard :scores_calculated?, after :clear_scores)"
      - "guard order: revert_match! roda ANTES de zerar — transition `after` só atribui scores_calculated_at=nil, scoring_token=nil, reversal_token=uuid; AASM persiste em 1 save (aasm.rb#aasm_fire_event: event before → may_fire? (guards) → event.fire (transition after) → aasm_fired (save)). Nenhum update_column fora do model"
      - "migration engines/core/db/migrate/20261031000015_add_reverted_status_to_core_matches.rb (remove/add_check_constraint, reversível: db:rollback + db:migrate ok): matches_status_valid + 'reverted'; matches_scored_has_timestamp = scored ⇒ timestamp; nova matches_timestamp_after_finish = timestamp só em finished|scored"
      - "spec/models/core/match_spec.rb → 21 examples, 0 failures; regressão: 'reverte com scores_calculated_at presente e zera depois' (status finished→reverted; spy no guard viu o timestamp original; depois scores_calculated_at nil) e 'falha o guard se scores_calculated_at for nil' (AASM::InvalidTransition)"
      - "justificativa corrigida em docs/spec-v3.md §3 (spec-v2 intocado) + docs/tickets/TICKET-0003-v3.md; INDEX aponta para v3"
    warnings:
      - "bloco literal da spec-v2 esperava scores_calculated_at `be_present` após revert_match! (zeragem externa via update_column); trocado por `be_nil` + spy no guard, conforme critério do tier (zerado DEPOIS, dentro do model)"
      - "estado `reverted` diverge de ADR 0001 §2 (scored → finished); ADR é imutável (docs/agents.md) — registrado em spec-v3"
      - "RevertMatchPointsService (discard + AuditLog) não é chamado pelo model: precisa de actor/ip_address; fica com TICKET-0005 (service/job chama revert_match!)"
      - "finish_match! ainda não enfileira ProcessMatchPointsJob (job = TICKET-0004)"
