      - "engines/cartola/db/migrate/20261031000017_create_cartola_scoring_rules.rb: name unique + goal_points, assist_points, yellow_card_penalty, red_card_penalty decimal(5,2) not null; add_check_constraint >= 0 em cada coluna"
      - "Bolao::ScoringRule.for(pool) → hash kind→points com override do pool sobre a regra global; Cartola::ScoringRule.default (name 'padrao')"
      - "spec/models/bolao/scoring_rule_spec.rb + spec/models/cartola/scoring_rule_spec.rb → 20 examples: points -1 → StatementInvalid; kind duplicado no mesmo pool (e global NULL) → RecordNotUnique; .for cai na global sem override"
      - "seeds globais 10/7/5/3 + Cartola 8/5/1/3 idempotentes; db:rollback STEP=2 + db:migrate ok"
    warnings:
      - "bolao_scoring_rules.pool_id sem FK: bolao_pools ainda é migration stub (TICKET-0004) — adicionar FK lá"
  - id: TICKET-0017
    status: ok
    branch: ticket/0017-scoring-engine
    commit: 7301ea3
    failures: 0
    evidence:
      - "app/services/scoring/engine.rb: SCORERS {bolao: BolaoScorer, cartola: CartolaScorer}, fallback NullScorer (0); Engine.score(game, **input); Engine.points_for(prediction:, home:, away:, rules: Bolao::ScoringRule.for(prediction.pool))"
      - "app/services/scoring/strategies/{exact_score,winner_and_goal_diff,winner,draw}.rb: kind + applies?(guess, result); BolaoScorer aplica a 1ª na ordem de precedência, nenhuma → 0"
      - "CartolaScorer: gols×goal_points + assistências×assist_points − amarelos×yellow_card_penalty − vermelhos×red_card_penalty"
      - "sem condicionais de pontuação nos models (models só guardam regras + lookup)"
