tickets:
  - id: TICKET-0015
    status: ok
    branch: ticket/0015-pundit-base
    commit: 78488aa
    failures: 0
    evidence:
      - "ApplicationController: include Pundit::Authorization; pundit_user = current_user (resume_session → Current.user); after_action verify_authorized (não-index) / verify_policy_scoped (index) via condições em action_name; rescue NotAuthorizedError → flash + redirect (HTML) / 403 JSON"
      - "ApplicationPolicy: admin → true, usuário comum e visitante → false; Scope admin → scope.all, demais → scope.none; MatchPolicy/CsvImportPolicy/PoolPolicy/SquadPolicy herdam; AuditLogPolicy read-only (create/update/destroy false até p/ admin)"
      - "spec/policies/ → 138 examples (shared example 'an admin-only policy': 7 actions × admin/regular/anônimo + Scope) para ApplicationPolicy + 5 policies"
      - "spec/controllers/pundit_verification_spec.rb: action sem authorize → Pundit::AuthorizationNotPerformedError; index sem policy_scope → PolicyScopingNotPerformedError; negado → redirect+flash / 403"
      - "Sessions/Passwords/Home: skip_after_action (não autorizam recurso); ActiveAdmin excluído da verificação (adapter Pundit = TICKET-0010)"
    warnings:
      - "Pundit resolve Core::Match → Core::MatchPolicy; as policies são top-level → mapear via policy_class / namespace do ActiveAdmin no TICKET-0010"
  - id: TICKET-0019
    status: ok
    branch: ticket/0019-auth-rate-limit
    commit: 9539c41
    failures: 0
    evidence:
      - "app/controllers/concerns/auth_rate_limiting.rb: rate_limit to: 5, within: 3.minutes, only: :create (Rails 8 nativo; store = cache_store → Solid Cache em produção) em SessionsController e PasswordsController"
      - "excesso → 429 renderizando o formulário com alerta 'Muitas tentativas. Aguarde alguns minutos e tente novamente.'; Rails.logger.warn 'rate_limited sessions#create ip=…'"
      - "config/environments/test.rb cache_store :memory_store + spec/support/cache.rb (Rails.cache.clear por exemplo)"
      - "spec/requests/rate_limit_spec.rb → 5 examples: 6ª tentativa em 3 min → 429; senha correta também bloqueada; travel 3.minutes+1s → volta a aceitar; log com IP; POST /passwords 6ª → 429"
    warnings:
      - "lograge ainda não configurado no app (spec §9, TICKET-0012/0021): a linha de bloqueio sai pelo Rails.logger"
  - id: TICKET-0018
    status: ok
    branch: ticket/0018-anonymize-user
    commit: 1791d36
    failures: 0
    evidence:
      - "migration engines/core/db/migrate/20261031000018: core_users + name, cpf (unique parcial, add_check_constraint 11 dígitos), active (default true), anonymized_at; check anonymized ⇒ inativo e sem cpf"
      - "Users::AnonymizeService.call(user:, actor:, ip_address:): with_lock (transação + FOR UPDATE); name 'Usuário anonimizado', email anon-<uuid>@invalid, cpf nil, senha aleatória, admin false, active false, anonymized_at; sessões destruídas; AuditLog action 'anonymize' (actor, auditable, ip_address, sem PII); 2ª chamada no-op"
      - "SessionsController usa Core::User.active.authenticate_by (inativo não entra)"
      - "spec/services/users/anonymize_spec.rb → 6 examples (nome/email/cpf anonimizados, id mantido, active false; nenhum PII; login antigo falha; AuditLog; idempotente by(1); rollback se AuditLog falha)"
  - id: TICKET-0007
    status: ok
    branch: ticket/0007-cartola-preview
    commit: 7df8803
    failures: 0
    evidence:
      - "migrations novas 20261031000019..21 (stubs 10..12 removidos): cartola_squads, cartola_lineups (+ cartola_lineup_players, round 1..38 check), cartola_player_scores (numeric(6,2), discarded_at, unique kept por player/match)"
      - "models Cartola::Squad, Lineup, LineupPlayer, PlayerScore (Discard::Model)"
      - "Cartola::Scorer (fórmula movida de Scoring::CartolaScorer p/ a engine — packwerk: cartola não depende do app); Scoring::Engine :cartola → Cartola::Scorer"
      - "Cartola::PreviewResult = Data.define(:player_points, :total); CalculatePreviewService.call(lineup:, stats:, rules: ScoringRule.default) → resultado frozen, player_points frozen"
      - "spec/services/cartola/preview_spec.rb → 5 examples: PreviewResult < Data e frozen; total = soma; Cartola::PlayerScore.count == 0 antes e depois (not_to change); nenhum INSERT/UPDATE/DELETE (spy sql.active_record)"
  - id: TICKET-0004
    status: ok
    branch: ticket/0004-process-match-points
    commit: b7e2884
    failures: 0
    evidence:
      - "migrations novas 20261031000022..24 (stubs 07..09 removidos): bolao_pools (+ FK bolao_scoring_rules.pool_id pendente do TIER-2), bolao_predictions (check guesses >= 0, discarded_at, unique kept pool/user/match), bolao_prediction_scores (check points >= 0, unique (prediction_id, scoring_token), discarded_at)"
      - "ProcessMatchPointsJob#perform(match_id, scoring_token): no-op se match.scoring_token == token; senão transação: Scoring::Engine.points_for por palpite kept (regras por pool em cache) → insert_all unique_by (prediction_id, scoring_token) → match.mark_scored!(token)"
      - "rescue StandardError → Rails.logger.error + Sentry.capture_exception(extra: match_id, scoring_token) → raise"
      - "spec/jobs/core/scoring/process_match_points_spec.rb → 8 examples: 2× mesmo match+token → PredictionScore +predictions.size (2ª no-op), match intocado na 2ª; pontos 10/7/0/0; override do pool; palpites discarded ignorados; falha simulada → log + Sentry + re-raise sem scores parciais; match não finished → InvalidTransition + rollback"
      - "specs de constraints Bolão: spec/models/bolao/prediction_spec.rb, prediction_score_spec.rb; scoring_rule_spec/engine_spec passaram a usar pools reais (FK)"
    warnings:
      - "finish_match! ainda não enfileira o job: core não pode depender do app (packwerk) — enfileirar no ponto de chamada (admin/service, TICKET-0010)"
