      - "app/controllers/jobs_dashboard_controller.rb + app/policies/jobs_dashboard_policy.rb"
      - "config/initializers/sentry.rb: DSN ENV.fetch('SENTRY_DSN'), environment, enabled_environments production/development, send_default_pii false, traces baixo, stub DebugTransport em development"
      - "jobs com rescue reportam ao Sentry: ProcessMatchPointsJob, ProcessCsvImportJob (e RevertMatchPointsJob)"
      - "spec/requests/admin/jobs_dashboard_spec.rb (4): visitante → /session/new, não-admin 403 (raiz e páginas internas), admin 200 com a fila 'scoring' lida do banco de fila"
      - "spec/policies/jobs_dashboard_policy_spec.rb (4) e spec/lib/sentry_spec.rb (4, Sentry::TestHelper + DummyTransport: config, ProcessMatchPointsJob, ProcessCsvImportJob, sentry:fake_exception)"
      - "runtime dev: bin/rails sentry:fake_exception → 'Sentry event 1ca0c09e07bd4aff9f5ecbf1ee1db445 sent to log/sentry_debug_events.log (environment: development)'; log com exception RuntimeError, tag source, user vazio"
      - "runtime dev (bin/rails server): /up 200; /admin/jobs anônimo 302 → /session/new; admin logado 200 '<title>Mission control - Queues</title>'"
