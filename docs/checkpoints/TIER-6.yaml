context_read:
  - AGENTS.md
  - docs/tickets/INDEX.md (0021 depende de 0012 no INDEX; ordem do tier = 0021 → 0012, seguida)
  - docs/spec-v2.md (§1 sentry ~> 7.2, §9 não-funcionais: Sentry DSN via ENV, Render web + worker, Neon, R2, Resend, keep-alive /up)
  - docs/checkpoints/TIER-5.yaml (TICKET-0010 ok → tier executado)
failure_policy: "falha = mesmo defeito falhar 2x consecutivas; execuções vermelhas com defeitos distintos são registradas, não bloqueiam"
decisions:
  - "critério do tier prevalece sobre o ticket: dashboard em /admin/jobs (ticket dizia /jobs)"
  - "/admin/jobs: base_controller_class = JobsDashboardController (< ApplicationController) com authorize :jobs_dashboard (JobsDashboardPolicy, admin-only); visitante → login, não-admin → 403 'Acesso negado' (mesma resposta do ActiveAdmin no TIER-5, em vez do 404 sugerido no ticket); HTTP basic auth do mission_control desligado"
  - "mission_control.jobs.adapters = [:solid_queue]; development usa :solid_queue (bin/jobs no Procfile.dev) e development/test ganham banco de fila (futebol_*_queue), espelhando produção; test mantém o adapter :test para os jobs"
  - "Sentry sem DSN real: development usa DSN local stub + Sentry::DebugTransport (eventos em log/sentry_debug_events.log); test/production não enviam nada sem SENTRY_DSN. send_default_pii = false, traces 0.05 em produção (0 fora), release = RENDER_GIT_COMMIT"
  - "bin/rails sentry:fake_exception = exception fake capturada (imprime event_id e destino)"
  - "Neon free = um banco: Solid Cache/Queue/Cable usam bancos irmãos derivados do DATABASE_URL (<db>_cache/_queue/_cable, criados pelo db:prepare); compartilhar o mesmo banco foi testado e NÃO carrega os schemas Solid (db:prepare vê o banco já preparado). CACHE_/QUEUE_/CABLE_DATABASE_URL sobrescrevem"
  - "seeds: false no primary de production e test: db:prepare do entrypoint não semeia produção (seeds criariam admin com senha padrão; db:seed manual continua bloqueado pelo guard do TICKET-0022) e o CI não semeia o banco de test"
  - "Render via Docker (Dockerfile existente): web free com HTTP_PORT=10000 + healthCheckPath /up, worker starter com ./bin/jobs; autoDeploy false, deploy pelo job deploy do CI (main) com RENDER_DEPLOY_HOOK_URL. Plano free sem worker: SOLID_QUEUE_IN_PUMA=1"
  - "/up fora do redirect HTTPS (ssl_options) e da host authorization: health check do Render e keep-alive (cron-job.org a cada 10 min) funcionam por HTTP e com qualquer Host"
  - "Resend por SMTP (smtp.resend.com:465, TLS, user 'resend', senha RESEND_API_KEY), sem gem extra; remetente RESEND_FROM"
  - "CI em ubuntu-24.04: ubuntu-latest (26.04) não tem Ruby 3.3.6 pré-compilado no setup-ruby"
