tier: 5
status: ok
branch: tier/5
base: tier/4
pr: https://github.com/LMafra/futebol/pull/7
signed_commits: true  # SSH ed25519, git log %G? = G em todos os commits do tier
context_read:
  - AGENTS.md
  - docs/tickets/INDEX.md
  - docs/spec-v2.md (§2 ActiveAdmin/Pundit, §7 regras, §8 jobs) + docs/spec-v3.md (§3 AASM)
  - docs/checkpoints/TIER-4.yaml (status ok)
stop_condition_check: "TICKET-0005, 0006, 0009 ok (TIER-4.yaml); TICKET-0007, 0015 ok (TIER-3.yaml) → nenhum blocked, tier executado"
failure_policy: "falha = mesmo defeito falhar 2x consecutivas; execuções vermelhas com defeitos distintos são registradas, não bloqueiam"
decisions:
  - "não existe Core::ScoringRule (TIER-2 escolheu dois models: Bolao::ScoringRule e Cartola::ScoringRule) → Core::ScoringRulePolicy é a policy base; Bolao::ScoringRulePolicy e Cartola::ScoringRulePolicy herdam dela (Pundit resolve pelo namespace do model)"
  - "policies movidas para o namespace do model (app/policies/core/*, bolao/*, cartola/*) via git mv; Pundit resolve Core::Match → Core::MatchPolicy sem policy_class"
  - "não-admin recebe 403: authentication_method = :require_authentication (só sessão) e Pundit nega; on_unauthorized_access = proc → ApplicationController#render_forbidden (HTML errors/forbidden ou JSON, status 403). Proc porque Symbol#to_proc não alcança método privado"
  - "custom pages autorizadas pelo PunditAdapter: page → ActiveAdmin::PagePolicy (index? = admin?), page_action pelo próprio nome (finalize?, revert?); além disso cada página autoriza o recurso real (authorize! :preview/:finalize/:revert no Core::Match, :test em Bolao::ScoringRule, READ em Core::AuditLog + scope_collection)"
  - "URLs das páginas = name.parameterize.underscore: /admin/bolaopreview, /admin/matchfinalizer (+ POST finalize), /admin/matchreversal (+ POST revert), /admin/scoringruletester, /admin/audithistory"
  - "finalização via FinalizeMatchService (with_lock: placar → start_match! se ainda scheduled com kickoff passado → finish_match! → AuditLog 'finalize'; depois do lock enfileira ProcessMatchPointsJob) — resolve o aviso do TIER-3 sobre quem enfileira a pontuação"
  - "confirmação da finalização = digitar o placar ('3x2', aceita espaços e ×) no campo score_confirmation; diferente → 422 sem mudanças"
  - "reversão enfileira RevertMatchPointsJob (o ticket pede enqueue); motivo obrigatório (presence, máx. 500) no form e required no textarea; o motivo vai para AuditLog.metadata.reason junto de ator e ip_address"
  - "preview Bolão no admin recebe candidate_home/candidate_away por GET e só então oferece 'Confirmar este placar', que abre o finalizador pré-preenchido (a confirmação continua exigida lá)"
  - "Ransack 4 exige allowlist: ApplicationRecord de cada engine devolve [] por padrão; cada model libera só os filtros usados no admin"
  - "resources extras do ticket: CsvImport (upload → save(context: :upload) exige arquivo → ProcessCsvImportJob), Pool, Squad, AuditLog (read-only, fora do menu); dashboard virou painel de pontuação (ao vivo, finalizadas aguardando pontuação, últimos logs)"
  - "form objects com model_name 'Finalization'/'Reversal' (namespace Admin:: evitado: é dos controllers do ActiveAdmin)"
  - "Naming/PredicateMethod: AllowedMethods [call, save] no .rubocop.yml (save booleano é convenção ActiveModel)"
