<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B6B3A">
  <title>Sem conexão · Craquefy</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #F4F1EA; color: #161616;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: #0B6B3A; color: #fff; padding: 12px 16px; font-weight: 800; font-size: 1.5rem; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 32rem;
           margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; }
    p { margin: 0; font-size: 1rem; line-height: 1.5; color: #3d3d3d; }
    button { align-self: flex-start; min-height: 48px; padding: 0 20px; border: 0; border-radius: 6px;
             background: #161616; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #161616; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>Craquefy</header>
  <main>
    <img src="/icon.svg" alt="" width="64" height="64">
    <h1>Você está sem conexão</h1>
    <p>Esta página precisa de internet. Quando o sinal voltar, toque em Tentar de novo: placares e lances são sempre buscados na hora.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
