name: CI

on:
  pull_request:
  push:
    branches: [main, 'tier/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (rubocop, packwerk, zeitwerk, brakeman)
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --format github

      - name: Packwerk
        run: bundle exec packwerk check

      - name: Zeitwerk
        run: bin/rails zeitwerk:check

      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Design lint (no gradient/blur/glow)
        run: |
          ! grep -rEn 'bg-gradient|backdrop-blur|shadow-[a-z]+-[0-9]{3}' \
            app/components app/views app/helpers app/javascript app/assets/tailwind config/tailwind.config.js

  test:
    name: RSpec
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare databases (primary + queue)
        run: bin/rails db:prepare

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: RSpec
        run: bundle exec rspec

  deploy:
    name: Deploy (Render)
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set; deploy is manual (see README)"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
