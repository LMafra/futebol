name: CI

on:
  pull_request:
  push:
    branches: [main, 'tier/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (rubocop, packwerk, zeitwerk, brakeman, bundler-audit)
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --format github

      - name: Packwerk validate (package.yml config)
        run: bundle exec packwerk validate

      - name: Packwerk
        run: bundle exec packwerk check

      - name: Zeitwerk
        run: bin/rails zeitwerk:check

      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Bundler Audit (gem CVEs)
        run: bundle exec bundler-audit check --update

      - name: Design lint (no gradient/blur/glow)
        run: |
          ! grep -rEn 'bg-gradient|backdrop-blur|shadow-[a-z]+-[0-9]{3}' \
            app/components app/views app/helpers app/javascript app/assets/tailwind config/tailwind.config.js

  test:
    name: RSpec
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare databases (primary + queue)
        run: bin/rails db:prepare

      # Fails on new schema × model mismatches; the reviewed backlog lives in .database_consistency.todo.yml.
      - name: Database consistency
        run: bundle exec database_consistency -c .database_consistency.todo.yml

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: RSpec
        run: bundle exec rspec

      # After RSpec: the seeded rows would otherwise leak into the transactional specs.
      - name: Seeds are idempotent (db:seed twice, same counts)
        run: |
          first=$(bin/rails db:seed | grep '^seeds ok')
          second=$(bin/rails db:seed | grep '^seeds ok')
          echo "1st: $first"
          echo "2nd: $second"
          test -n "$first" && test "$first" = "$second"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks detect (full history)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose

  deploy:
    name: Deploy (Render)
    needs: [lint, test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set; deploy is manual (see README)"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
