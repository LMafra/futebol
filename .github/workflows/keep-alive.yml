name: Keep Render alive

# The free Render web service sleeps after 15 min without traffic. Scheduled runs only fire from the default branch,
# and GitHub may delay them or disable the schedule after 60 days without repository activity.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /up
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RENDER_APP_HOST: ${{ secrets.RENDER_APP_HOST }}
    steps:
      # --max-time covers a cold start; /up skips the HTTPS redirect and the host check (production.rb).
      - name: Ping /up
        run: |
          if [ -z "$RENDER_APP_HOST" ]; then
            echo "::notice::RENDER_APP_HOST not set; keep-alive skipped (see docs/OPERATIONS.md#keep-alive)"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
            -o /dev/null -w "%{http_code}\n" "https://${RENDER_APP_HOST}/up"
