version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      rails:
        patterns: ['rails', 'action*', 'active*', 'railties']
        exclude-patterns: ['activeadmin']
    # Pre-release pinned on purpose (docs/adr/0002-activeadmin-rails81.md): bump by hand.
    ignore:
      - dependency-name: activeadmin

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
